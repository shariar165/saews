[project]
name = "saews"
version = "1.0.0"
description = "AI-Driven Socio-Academic Early Warning & Personalized Decision Support System (SE331 capstone prototype)"
requires-python = ">=3.11"
# Runtime deps (keep in sync with requirements.txt) — Vercel installs from here.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36,<3.0",
    "alembic>=1.14",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.18",
    "slowapi>=0.1.9",
    "pandas>=2.2",
    "numpy>=2.1",
    "scikit-learn~=1.9.1",
    "joblib>=1.4",
    "psycopg[binary]>=3.2",
    "anthropic>=2.12,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"backend/app/services/recommendations.py" = ["E501"]  # catalogue text
